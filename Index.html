<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:Barlow,system-ui,sans-serif;background:#e9edf3;color:#1b2433}
  .app{display:grid;height:100vh}
  /* ---------- EDITOR ---------- */
  .editor{background:#fff;border-right:1px solid #d5dbe5;display:flex;flex-direction:column;min-height:0}
  .toolbar{display:flex;flex-wrap:wrap;gap:6px;padding:12px;border-bottom:1px solid #e3e7ee;background:#f7f9fc}
  .toolbar h1{font-size:15px;margin:0 0 4px;width:100%;font-weight:700}
  .btn{border:1px solid #c9d1de;background:#fff;border-radius:7px;padding:7px 10px;font:600 13px Barlow,sans-serif;cursor:pointer;color:#1b2433}
  .btn:hover{background:#eef2f8}
  .btn.primary{background:#0b2a5b;color:#fff;border-color:#0b2a5b}
  .btn.primary:hover{background:#133a78}
  .btn.danger{color:#b42318}
  .btn.sm{padding:3px 8px;font-size:12px}
  .form{overflow:auto;padding:8px 12px 40px;flex:1}
  details{border:1px solid #e3e7ee;border-radius:9px;margin:8px 0;background:#fff}
  summary{cursor:pointer;padding:9px 12px;font-weight:700;font-size:14px;list-style:none;display:flex;justify-content:space-between}
  summary::after{content:"▸";transition:transform .15s}
  details[open] summary::after{transform:rotate(90deg)}
  details>.body{padding:4px 12px 12px}
  label.f{display:block;font-size:12px;font-weight:600;color:#56627a;margin:8px 0 3px}
  input[type=text],input[type=number],textarea,select{width:100%;padding:7px 8px;border:1px solid #cdd5e1;border-radius:6px;font:500 14px Barlow,sans-serif;color:#1b2433;background:#fff}
  textarea{min-height:56px;resize:vertical}
  input[type=color]{width:44px;height:30px;border:1px solid #cdd5e1;border-radius:6px;padding:2px;background:#fff}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .item{border:1px dashed #cdd5e1;border-radius:8px;padding:6px 10px 10px;margin:10px 0;background:#fafbfd}
  .item-head{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:13px;color:#0b2a5b}
  .item-head .acts{display:flex;gap:4px}
  .hint{font-size:11.5px;color:#7a869c;margin-top:3px}
  .imgf{display:flex;gap:8px;align-items:center}
  .imgf img{width:44px;height:44px;border-radius:50%;object-fit:cover;border:1px solid #ccd}
  .chk{display:flex;gap:6px;align-items:center;font-size:13px;margin-top:8px}

  .app{grid-template-columns:var(--ed,460px) 1fr}
  .toolbar h1{width:auto;margin:0 8px 0 0;align-self:center}
  .toolbar{align-items:center}
  .saved{font-size:11.5px;color:#2e7d32;width:100%}
  details.menu{border:none;margin:0;background:none;position:relative}
  details.menu summary{padding:7px 10px;display:inline-block}
  details.menu summary::after{content:none}
  details.menu .pop{position:absolute;z-index:20;top:110%;left:0;background:#fff;border:1px solid #d5dbe5;border-radius:9px;box-shadow:0 8px 24px rgba(0,0,0,.15);padding:6px;display:flex;flex-direction:column;gap:4px;min-width:230px}
  .tabs{display:flex;gap:0;padding:0 6px;border-bottom:1px solid #e3e7ee;background:#f7f9fc;overflow-x:auto;flex:none}
  .tab{flex:1 0 auto;border:none;background:none;padding:10px 6px 8px;font:700 13px Barlow,sans-serif;color:#6a7690;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
  .tab:hover{color:#0b2a5b}
  .tab.on{color:#0b2a5b;border-bottom-color:#ffd200}
  .intro{background:#f2f6fc;border-left:4px solid #ffd200;padding:9px 11px;border-radius:6px;font-size:14px;color:#33405a;margin:12px 0 6px;line-height:1.35}
  .say{background:#0b2a5b;color:#fff;border-radius:10px;padding:10px 14px;margin-top:12px;font-size:13px}
  .say b{display:block;color:#ffd200;font:700 20px/1.15 "Barlow Condensed",sans-serif;margin-top:4px}
  .nav{display:flex;justify-content:space-between;margin-top:20px;padding-top:12px;border-top:1px solid #eef1f6}
  .lcard{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:start;border:1px solid #e3e7ee;border-radius:10px;padding:10px;margin:10px 0}
  .ph-drop{width:96px;height:96px;border-radius:50%;border:3px solid #ffd200;background:#eef1f6 center/cover;display:grid;place-items:center;cursor:pointer;font:700 13px Barlow;color:#6a7690;position:relative}
  .ph-drop:hover::after{content:"Cambiar";position:absolute;inset:0;border-radius:50%;background:rgba(11,42,91,.55);color:#fff;display:grid;place-items:center;font-size:12px}
  .stp{display:flex;align-items:center;justify-content:space-between;border:1px solid #e3e7ee;border-radius:10px;padding:8px 12px;margin:8px 0}
  .stp-l{font-weight:700;font-size:15px}
  .stepper{display:flex;align-items:center;gap:6px}
  .stepper .btn{width:38px;height:38px;font-size:20px;padding:0}
  .stepper input{width:76px;text-align:center;font-size:20px;font-weight:700}
  .stepper input[readonly]{background:#f2f4f8;color:#56627a}
  .gtools{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
  .gwrap{overflow-x:auto;border:1px solid #dfe4ec;border-radius:8px}
  table.grid{width:100%;min-width:760px;border-collapse:collapse;table-layout:fixed}
  table.grid th{background:#0b2a5b;color:#fff;font:600 12px Barlow,sans-serif;padding:7px 6px;text-align:left;position:sticky;top:0}
  table.grid td{border-top:1px solid #dfe4ec;border-left:1px solid #eef1f6;padding:0;vertical-align:top;background:#fff}
  table.grid tr:nth-child(odd) td{background:#fbfcfe}
  table.grid .cell{border:none;border-radius:0;min-height:0;padding:7px 6px;font-size:13.5px;resize:none;overflow:hidden;width:100%;display:block;background:transparent;line-height:1.3}
  table.grid .cell.b{font-weight:700;color:#0b2a5b}
  table.grid .cell:focus{outline:2px solid #ffd200;outline-offset:-2px;background:#fffdf0}
  table.grid td.acts{padding:4px 2px;background:#f7f9fc;text-align:center}
  .qadd{display:flex;gap:2px;padding:0 4px 4px}
  .mini{border:1px solid #c9d1de;background:#fff;border-radius:5px;font:600 11.5px Barlow,sans-serif;padding:2px 6px;cursor:pointer;color:#33405a}
  .mini:hover{background:#eef2f8}.mini.danger{color:#b42318}
  .item-head .acts{display:flex;gap:3px}
  .pastebox{background:#fffbea;border:1px solid #f0d36b;border-radius:9px;padding:4px 10px 6px;margin:6px 0}
  .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
  .chip{border:1px solid #c9d1de;border-radius:14px;background:#fff;padding:4px 10px;font:500 12.5px Barlow,sans-serif;cursor:pointer;color:#33405a}
  .chip:hover{border-color:#0b2a5b}
  .chip.used{background:#e8f5e9;border-color:#8bc34a;color:#2e7d32}
  .preview{flex-direction:column;align-items:center;justify-content:flex-start}
  .hintp{font-size:12px;color:#6a7690;margin-bottom:8px}
  .warn{background:#fff4ce;border:1px solid #f0c000;color:#5c4400;padding:8px 12px;border-radius:8px;font-size:13px;margin-bottom:8px;max-width:900px}
  .preview [data-go]{cursor:pointer}
  .preview [data-go]:hover{outline:4px dashed #ffd200;outline-offset:4px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:#0b2a5b;color:#fff;padding:10px 16px;border-radius:9px;font:600 14px Barlow,sans-serif;opacity:0;pointer-events:none;transition:.2s;z-index:50}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  /* ---------- PREVIEW ---------- */
  .preview{overflow:auto;padding:24px;display:flex;justify-content:center;align-items:flex-start}
  .scaler{overflow:hidden;flex:none}
  @media (max-width:900px){.app{grid-template-columns:1fr;height:auto}.editor{max-height:none}.form{overflow:visible}}

  /* ---------- FLYER ---------- */
  #flyer{font-synthesis:none;--navy:#0b2a5b;--navy2:#123b7a;--yellow:#ffd200;--sky1:#1d3f7a;--sky2:#6d7fb0;
    width:1200px;position:relative;overflow:hidden;font-family:"Barlow Condensed",Arial Narrow,sans-serif;color:var(--navy);
    background:linear-gradient(180deg,var(--sky1) 0%,#4c5f97 14%,#c58c7a 22%,var(--sky2) 30%,#8fa3cc 55%,#b9c7e2 100%);padding-bottom:0}
  #flyer *{box-sizing:border-box}
  .fl-inner{transform-origin:top left;display:flex;flex-direction:column}
  .fl-body{flex:1;display:flex;flex-direction:column;justify-content:space-evenly;padding:4px 0 10px}
  .fl-body .card{margin-bottom:0}
  .fl-top{position:relative;padding:120px 24px 18px 40px;display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
  .fl-hero{position:absolute;right:0;top:118px;width:620px;height:150px;object-fit:cover;-webkit-mask-image:linear-gradient(90deg,transparent,#000 18%);mask-image:linear-gradient(90deg,transparent,#000 18%)}
  .fl-brand{position:absolute;left:78px;top:22px;display:flex;align-items:center;gap:26px;color:#fff}
  .fl-brand .b1 b{display:block;font:800 40px/0.9 Barlow,sans-serif;letter-spacing:-1px}
  .fl-brand .b1 span{display:block;font:700 26px/1 Barlow,sans-serif}
  .fl-brand .sep{width:2px;height:64px;background:rgba(255,255,255,.8)}
  .fl-brand .b2 b{display:block;font:700 40px/1 Barlow,sans-serif;letter-spacing:-1px}
  .fl-brand .b2 span{display:block;font:500 16px Barlow,sans-serif;margin-top:2px}
  .fl-flash{position:absolute;right:40px;top:20px;width:420px}
  .fl-flash .t1{background:var(--yellow);transform:skewX(-14deg);padding:4px 30px;display:inline-block;margin-left:30px}
  .fl-flash .t1 span{display:inline-block;transform:skewX(14deg);font:italic 900 54px/1 "Barlow Condensed";color:var(--navy);letter-spacing:1px}
  .fl-flash .t2{background:#fff;transform:skewX(-14deg);padding:2px 26px;display:inline-block;margin-top:-4px}
  .fl-flash .t2 span{display:inline-block;transform:skewX(14deg);font:italic 900 46px/1 "Barlow Condensed";color:var(--navy)}
  .fl-mega{position:absolute;right:6px;top:4px;width:84px;height:84px;color:var(--navy)}
  .fl-leaders{display:flex;gap:14px;position:relative}
  .leader{width:200px;text-align:center}
  .leader .ph{width:196px;height:196px;border-radius:50%;border:7px solid var(--yellow);background:#d9dde6 center/cover;margin:0 auto;box-shadow:0 6px 18px rgba(0,0,0,.35)}
  .leader .nm{background:var(--navy);border:2px solid #fff;border-radius:12px;color:#fff;margin-top:-6px;padding:4px 6px;position:relative}
  .leader .nm b{display:block;font:italic 800 24px/1.05 "Barlow Condensed";text-transform:uppercase}
  .leader .nm span{display:block;font:italic 500 18px/1.1 "Barlow Condensed"}
  .leader .tel{margin-top:6px;display:flex;align-items:center;background:var(--navy);border:3px solid var(--yellow);border-radius:24px;padding:2px 10px 2px 3px;color:#fff;text-align:left}
  .leader .tel .ic{width:38px;height:38px;border-radius:50%;background:#fff;color:var(--navy);display:grid;place-items:center;flex:none}
  .leader .tel .ic svg{width:22px;height:22px}
  .leader .tel div{margin-left:8px}
  .leader .tel small{display:block;font:500 13px/1 Barlow}
  .leader .tel b{display:block;font:700 22px/1.05 Barlow;letter-spacing:.5px}
  .fl-lfs{position:relative;margin-top:160px;width:500px;flex:none;background:var(--navy);border:3px solid #fff;border-radius:18px;padding:12px 16px 14px;color:#fff}
  .fl-lfs .hd{display:flex;align-items:center;gap:14px}
  .fl-lfs .hd svg{width:66px;height:66px;flex:none}
  .fl-lfs .hd b{font:italic 800 38px/0.95 "Barlow Condensed";text-transform:uppercase}
  .fl-lfs .hd b em{color:var(--yellow);font-style:inherit}
  .fl-lfs .dt{margin-top:10px;background:var(--yellow);border-radius:30px;display:flex;align-items:center;gap:14px;padding:6px 16px;color:var(--navy)}
  .fl-lfs .dt svg{width:52px;height:52px;flex:none}
  .fl-lfs .dt span{font:600 27px/1.08 "Barlow Condensed"}
  .card{margin:0 18px 14px;background:rgba(255,255,255,.96);border:3px solid #fff;border-radius:18px;box-shadow:0 4px 14px rgba(10,30,70,.25);overflow:hidden}
  .ribbon{background:linear-gradient(90deg,var(--navy),var(--navy2));color:#fff;display:flex;align-items:center;gap:14px;padding:6px 18px;border-radius:0 0 30px 0;margin-right:20px}
  .ribbon svg{width:40px;height:40px;flex:none;color:var(--yellow)}
  .ribbon b{font:italic 800 28px/1 "Barlow Condensed";text-transform:uppercase}
  .ribbon small{display:block;font:italic 500 19px/1 "Barlow Condensed";color:#dfe6f3}
  .staff{display:flex;padding:10px 0 12px}
  .staff>div{flex:1;display:flex;align-items:center;justify-content:center;gap:12px;border-right:2px solid #c7cfdc}
  .staff>div:last-child{border:none}
  .staff svg{width:72px;height:72px;flex:none}
  .staff b{display:block;font:800 46px/0.95 "Barlow Condensed";color:#0d1c33}
  .staff span{display:block;font:500 22px/1 "Barlow Condensed";color:#0d1c33;max-width:140px}
  table.eq{width:calc(100% - 20px);margin:8px 10px 10px;border-collapse:collapse;font-family:"Barlow Condensed"}
  table.eq th{background:var(--yellow);font:700 18px/1 "Barlow Condensed";color:var(--navy);padding:9px 6px;text-transform:uppercase;border-right:2px solid #fff}
  table.eq th:first-child{border-radius:10px 0 0 10px}table.eq th:last-child{border-radius:0 10px 10px 0;border:none}
  table.eq td{border-bottom:1.5px solid #cfd6e2;border-right:1.5px solid #cfd6e2;padding:7px 8px;vertical-align:middle;font:500 17px/1.12 "Barlow Condensed";color:#0d1c33}
  table.eq td:last-child{border-right:none}
  table.eq tr:last-child td{border-bottom:none}
  .eqcode{display:flex;align-items:center;gap:8px;background:var(--navy);color:#fff;border-radius:10px;padding:5px 10px;font:800 28px/1 "Barlow Condensed"}
  .eqcode svg{width:34px;height:26px;color:var(--yellow);flex:none}
  .ia{display:flex;gap:6px;align-items:center}
  .ia svg{width:22px;height:22px;flex:none}
  .ia b{font:700 23px/1 "Barlow Condensed";white-space:nowrap}
  .ia.sup b{white-space:normal;font-size:19px;line-height:1.05}
  .ia.sup small{font-size:15px;margin-top:2px}
  .ia small{display:block;font:500 14px/1.05 "Barlow Condensed"}
  .dash{text-align:center;font-weight:700;font-size:22px}
  ul.res{margin:0;padding-left:16px}
  .resp{display:flex;padding:8px 6px 12px}
  .resp>div{flex:1;text-align:center;padding:2px 8px;border-right:2px solid #c7cfdc;font:500 18px/1.05 "Barlow Condensed";color:#0d1c33}
  .resp>div:last-child{border:none}
  .resp svg{width:46px;height:46px;display:block;margin:0 auto 4px;color:#0d1c33}
  .resp svg.warn{color:#0d1c33}
  .ctrl{display:flex;gap:10px;padding:10px 10px 14px}
  .ctrl>div{flex:1;min-width:0}
  .ctrl .ch{background:var(--yellow);border-radius:10px;padding:5px 12px;color:var(--navy);min-height:62px}
  .ctrl .ch b{display:block;font:italic 800 28px/1 "Barlow Condensed"}
  .ctrl .ch span{display:block;font:italic 500 17px/1.02 "Barlow Condensed"}
  .ctrl ul{list-style:none;padding:6px 0 0;margin:0}
  .ctrl li{display:flex;gap:7px;align-items:flex-start;font:500 16.5px/1.02 "Barlow Condensed";color:#0d1c33;margin:7px 0}
  .ctrl li svg{width:20px;height:20px;flex:none;margin-top:1px;color:var(--navy)}
  .fl-foot{margin-top:4px;background:linear-gradient(90deg,var(--navy),#0f3166);color:#fff;display:flex;align-items:center;padding:20px 24px 22px;gap:18px}
  .fl-foot .chev{width:60px;height:40px;color:var(--yellow);flex:none}
  .fl-foot .tx{flex:1}
  .fl-foot .tx b{display:block;font:italic 700 32px/1.05 "Barlow Condensed"}
  .fl-foot .tx span{display:block;font:italic 500 22px/1.15 "Barlow Condensed";color:#dfe6f3}
  .fl-foot .slash{width:3px;height:70px;background:var(--yellow);transform:skewX(-18deg)}
  .fl-foot .safe{display:flex;align-items:center;gap:8px}
  .fl-foot .safe svg{width:72px;height:60px;color:var(--yellow)}
  .fl-foot .safe b{font:italic 900 32px/0.9 "Barlow Condensed"}
</style>

const FORMATS={'3:4':4/3,'4:5':5/4,'9:16':16/9,'1:1':1,'libre':0};
function layout(){
  const f=document.getElementById('flyer'), inn=document.getElementById('flInner');
  const W=1200, r=FORMATS[S.format]??4/3;
  if(!r){document.getElementById('warn').hidden=true;f.style.height='auto';inn.style.cssText='';inn.style.width=W+'px';fit();return}
  const H=Math.round(W*r); f.style.height=H+'px';
  let k=1;
  for(let i=0;i<6;i++){
    inn.style.transform='none'; inn.style.width=(W/k)+'px'; inn.style.minHeight=(H/k)+'px';
    const h=inn.offsetHeight; if(h<=H/k+1)break; k*=(H/k)/h;
  }
  inn.style.transform=`scale(${k})`;
  const w=document.getElementById('warn'); if(k<0.8){w.hidden=false;w.textContent=`⚠ Hay mucho contenido: la letra se redujo al ${Math.round(k*100)} %. Acorta textos o quita filas para que se lea mejor.`}else w.hidden=true;
  fit();
}
function fit(){
  const p=document.getElementById('preview'), sc=document.getElementById('scaler'), f=document.getElementById('flyer');
  const k=Math.min(1,(p.clientWidth-48)/1200,Math.max(0.3,(p.clientHeight-90)/f.offsetHeight));
  sc.style.width=1200*k+'px'; sc.style.height=f.offsetHeight*k+'px';
  f.style.transform=`scale(${k})`; f.style.transformOrigin='top left';
}
window.addEventListener('resize',fit);

function dateText(){
  if(!S.dateStart||!S.dateEnd)return S.dates;
  const a=pd(S.dateStart),b=pd(S.dateEnd),same=a.getMonth()===b.getMonth();
  return `Del ${DIAS[a.getDay()]} ${a.getDate()}${same?'':' de '+MESES[a.getMonth()]} al\n${DIAS[b.getDay()]} ${b.getDate()} de ${MESES[b.getMonth()]}`;
}
function rangeDays(){
  const out=[]; if(!S.dateStart||!S.dateEnd)return out;
  const d=pd(S.dateStart),e=pd(S.dateEnd);
  for(let i=0;d<=e&&i<31;i++){out.push(`${DABR[d.getDay()]} ${d.getDate()} ${MABR[d.getMonth()]}`);d.setDate(d.getDate()+1)}

}

  diseno:()=>`<div class="intro">Ajustes de diseño. Normalmente no hace falta tocarlos cada semana.</div>
    ${sec('Formato y colores',`${F.sel('Relación de aspecto','format',Object.keys(FORMATS).map(k=>[k,k==='libre'?'Libre (alto según contenido)':k+(k==='3:4'?' (1200 × 1600 px)':'')]),'fmt')}
      <div class="row2"><div>${F.color('Color principal','colors.navy')}</div><div>${F.color('Color acento','colors.yellow')}</div></div>`,true)}
    ${sec('Encabezado',`<div class="row2"><div>${F.text('Logo izq. línea 1','brand.left1')}</div><div>${F.text('Logo izq. línea 2','brand.left2')}</div><div>${F.text('Logo der. línea 1','brand.right1')}</div><div>${F.text('Logo der. línea 2','brand.right2')}</div><div>${F.text('Título 1','title1')}</div><div>${F.text('Título 2','title2')}</div><div>${F.text('Recuadro líderes (línea 1)','leadersTitleA')}</div><div>${F.text('Recuadro líderes (línea 2)','leadersTitleB')}</div></div>${F.img('Imagen de maquinaria (horizontal, aprox. 3,5:1)','hero')}`)}
    ${sec('Títulos de secciones',`${F.text('Personal','staffTitle')}${F.text('Subtítulo personal','staffSub')}${F.text('Equipos','equipTitle')}${F.text('Controles','ctrlTitle')}${F.text('Responsabilidades','respTitle')}`)}
    ${sec('Tabla de equipos',`${F.sel('Ícono de la 3.ª columna','col3Icon',[['pin','Ubicación (área)'],['cal','Calendario (día)'],['none','Sin ícono']])}
      ${F.sel('Contenido de la 4.ª columna','col4Mode',[['person','Supervisor y técnicos'],['clock','Duración (horas)'],['none','Texto sin ícono']],'col4')}
      <label class="f">Encabezados de columna</label><div class="row2">${S.cols.map((c,i)=>`<input type="text" data-p="cols.${i}" value="${esc(c)}">`).join('')}</div>`)}
    ${sec('Pie de página',`${F.text('Frase principal','foot1')}${F.text('Frase secundaria','foot2')}<div class="row2"><div>${F.text('Sello línea 1','badge1')}</div><div>${F.text('Sello línea 2','badge2')}</div></div>`)}`
};
function list(path,label,fields,blank){
  const arr=getP(path);
  return arr.map((it,i)=>`<div class="item"><div class="item-head">${label} ${i+1}${rowActs(path,i)}</div>${fields(`${path}.${i}`)}</div>`).join('')
    +`<button class="btn sm" data-add="${path}" data-blank='${esc(JSON.stringify(blank))}'>+ Agregar ${label.toLowerCase()}</button>`;
}
function buildForm(){
  document.getElementById('tabs').innerHTML=TABS.map(([k,t])=>`<button class="tab ${k===tab?'on':''}" data-tab="${k}">${t}</button>`).join('');
  const form=document.getElementById('form'), open=[...form.querySelectorAll('details.sec')].map(d=>d.open), prevTab=form.dataset.tab;
  form.innerHTML=PANES[tab]()+nav();
  if(prevTab===tab) form.querySelectorAll('details.sec').forEach((d,i)=>{if(i in open)d.open=open[i]});
  form.dataset.tab=tab;
  form.querySelectorAll('textarea').forEach(grow);
  document.documentElement.style.setProperty('--ed',tab==='equipos'?'min(980px,64vw)':'460px');
  requestAnimationFrame(fit);
}
function grow(t){t.style.height='auto';t.style.height=t.scrollHeight+'px'}
function go(t){tab=t;pasteOpen=false;buildForm();document.getElementById('form').scrollTop=0}

/* ---- tablas: parseo de Excel / CSV ---- */
function parseDelim(text){
  text=text.replace(/^﻿/,'').replace(/\r\n?/g,'\n');
  if(/^sep=.\n/i.test(text))text=text.replace(/^sep=.\n/i,'');
  const first=text.split('\n')[0]; const d=first.includes('\t')?'\t':first.includes(';')?';':',';
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cell+='"';i++}else q=false}else cell+=c}
    else if(c==='"'&&cell==='')q=true;
    else if(c===d){row.push(cell);cell=''}
    else if(c==='\n'){row.push(cell);rows.push(row);row=[];cell=''}
    else cell+=c}
  if(cell!==''||row.length){row.push(cell);rows.push(row)}
  return rows.filter(r=>r.some(c=>c.trim()));
}
function rowsToEquip(rows){
  if(rows.length&&/equipo|c[oó]digo/i.test(rows[0][0]||''))rows=rows.slice(1);
  return rows.map(r=>{const o={};GK.forEach((k,j)=>{let v=(r[j]||'').trim();if(k==='resources')v=v.split(/\s*\|\s*|\n/).map(s=>s.trim()).filter(Boolean).join('\n');o[k]=v});return o});
}
function csvCell(v){v=String(v??'');return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function download(name,blob){const a=document.createElement('a');a.download=name;a.href=URL.createObjectURL(blob);a.click()}
function loadScript(src){return new Promise((ok,ko)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=ko;document.head.appendChild(s)})}
async function importFile(fl){
  let rows;
  if(/\.xlsx?$/i.test(fl.name)){
    try{ if(!window.XLSX) await loadScript('https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js'); }
    catch(e){ toast('Para leer .xlsx se necesita internet. Guarda el Excel como CSV e impórtalo.'); return }
    const wb=XLSX.read(await fl.arrayBuffer()); rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''}).map(r=>r.map(String)).filter(r=>r.some(c=>c.trim()));
  } else rows=parseDelim(await fl.text());
  const eq=rowsToEquip(rows); if(!eq.length){toast('No encontré filas en el archivo.');return}
  if(S.equipment.length && !confirm(`Se importarán ${eq.length} filas. ¿Reemplazar la tabla actual? (Cancelar = agregarlas al final)`)) S.equipment.push(...eq); else S.equipment=eq;
  buildForm();render();toast(`✓ ${eq.length} filas importadas`);
}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2800)}
function fmtPhone(v){const d=v.replace(/\D/g,'');return d.length===10?`${d.slice(0,3)} ${d.slice(3,6)} ${d.slice(6)}`:v}

/* ---- eventos ---- */
const form=document.getElementById('form');
document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b)go(b.dataset.tab)});
document.getElementById('preview').addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g)go(g.dataset.go)});
form.addEventListener('input',e=>{const t=e.target,p=t.dataset.p; if(!p||t.readOnly)return; setP(p,t.value); if(t.tagName==='TEXTAREA')grow(t); render(); if(p.startsWith('controls.'))refreshChips()});
function refreshChips(){} // los chips se actualizan al salir del campo
form.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='autoTotal'){S.autoTotal=t.checked;render();buildForm();return}
  if(t.id==='datesManual'){S.datesManual=t.checked;if(t.checked)S.dates=dateText();render();buildForm();return}
  if(t.id==='col4'){S.col4Mode=t.value;buildForm();render();return}
  if(t.id==='fmt'){S.format=t.value;render();return}
  if(t.dataset.phone!==undefined){t.value=fmtPhone(t.value);setP(t.dataset.p,t.value);render();return}
  if(t.dataset.rebuild!==undefined){if(S.dateStart&&S.dateEnd&&S.dateEnd<S.dateStart){S.dateEnd=S.dateStart}render();buildForm();return}
  if(t.dataset.p&&t.dataset.p.startsWith('controls.')&&t.tagName==='TEXTAREA'){buildForm();return}
  const p=t.dataset.img; if(!p||!t.files[0])return;
  const fr=new FileReader(); fr.onload=()=>{shrink(fr.result,p==='hero'?1200:500,url=>{setP(p,url);buildForm();render()})}; fr.readAsDataURL(t.files[0]);
});
form.addEventListener('paste',e=>{
  const t=e.target; if(t.dataset.gc===undefined)return;
  const txt=e.clipboardData.getData('text/plain'); if(!/[\t\n]/.test(txt.trim()))return;
  e.preventDefault();
  const rows=parseDelim(txt); const r0=+t.dataset.p.split('.')[1], c0=+t.dataset.gc;
  rows.forEach((r,ri)=>{const i=r0+ri; if(!S.equipment[i])S.equipment[i]={code:'',area:'',activity:'',hours:'',note:'',resources:'',tasks:''};
    r.forEach((v,ci)=>{const k=GK[c0+ci]; if(!k)return; v=v.trim(); if(k==='resources')v=v.split(/\s*\|\s*|\n/).filter(Boolean).join('\n'); S.equipment[i][k]=v})});
  buildForm();render();toast(`✓ ${rows.length} fila(s) pegadas`);
});
form.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return;
  const d=b.dataset;
  if(d.tab){go(d.tab);return}
  if(d.clear){setP(d.clear,'');buildForm();render();return}
  if(d.add){getP(d.add).push(JSON.parse(d.blank));buildForm();render();return}
  if(d.del){const[p,i]=d.del.split('|');const it=getP(p)[+i];const name=it.code||it.name||it.title||'';if(!confirm(`¿Eliminar ${name||'este elemento'}?`))return;getP(p).splice(+i,1);buildForm();render();return}
  if(d.dup){const[p,i]=d.dup.split('|');const a=getP(p);a.splice(+i+1,0,clone(a[+i]));buildForm();render();return}
  if(d.mv){const[p,i,dd]=d.mv.split('|');const a=getP(p),j=+i+ +dd;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];buildForm();render();return}
  if(d.step){const[p,n]=d.step.split('|');setP(p,String(Math.max(0,(parseInt(getP(p))||0)+ +n)));render();buildForm();return}
  if(d.hito){const[i,w]=d.hito.split('|');const e2=S.equipment[+i];e2.resources=(e2.resources?e2.resources.replace(/\s+$/,'')+'\n':'')+w+': ';buildForm();render();
    const ta=form.querySelector(`[data-p="equipment.${i}.resources"]`);ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);return}
  if(d.chip!==undefined){const c=S.controls[+d.chip],v=d.val,ls=lines(c.items);c.items=(ls.includes(v)?ls.filter(x=>x!==v):[...ls,v]).join('\n');buildForm();render();return}
  switch(d.act){
    case 'png':document.getElementById('bPng').click();break;
    case 'addrow':{const last=S.equipment.at(-1);S.equipment.push({code:last?.code||'',area:'',activity:'',hours:last?.hours||'',note:last?.note||'',resources:'',tasks:''});buildForm();render();
      const r=S.equipment.length-1;form.querySelector(`[data-p="equipment.${r}.area"]`)?.focus();break}
    case 'paste':pasteOpen=!pasteOpen;buildForm();if(pasteOpen)document.getElementById('pasteArea').focus();break;
    case 'pasteReplace':case 'pasteAppend':{const eq=rowsToEquip(parseDelim(document.getElementById('pasteArea').value));if(!eq.length){toast('No hay filas para pegar.');break}
      S.equipment=d.act==='pasteReplace'?eq:[...S.equipment,...eq];pasteOpen=false;buildForm();render();toast(`✓ ${eq.length} fila(s) cargadas`);break}
    case 'tpl':{const rows=[gridLabels(),...S.equipment.map(e=>GK.map(k=>e[k]))];
      download('plantilla-equipos.csv',new Blob(['﻿sep=;\n'+rows.map(r=>r.map(csvCell).join(';')).join('\n')],{type:'text/csv;charset=utf-8'}));toast('Ábrela en Excel, llénala y usa “Importar archivo”.');break}
    case 'import':document.getElementById('fImport').click();break;
    case 'clear':if(confirm('¿Vaciar toda la tabla de equipos?')){S.equipment=[];buildForm();render()}break;
    case 'syncCtrl':{let n=0;const have=S.controls.map(c=>(c.title||'').split(/[\s·]/)[0].toUpperCase());
      [...new Set(S.equipment.map(e=>e.code.trim()).filter(Boolean))].forEach(code=>{if(have.includes(code.toUpperCase()))return;
        const acts=S.equipment.filter(e=>e.code.trim()===code).map(e=>e.activity.replace(/\s*\(.*?\)\s*/g,' ').replace(/\.$/,'').trim()).filter(Boolean);
        S.controls.push({title:code,subtitle:acts.length?'('+acts[0].slice(0,45)+(acts[0].length>45?'…':'')+')':'',items:'Permiso de trabajo.'});n++});
      buildForm();render();toast(n?`✓ ${n} tarjeta(s) nuevas. Revisa sus controles.`:'Todas las máquinas de la tabla ya tienen tarjeta.');break}
  }
});
document.getElementById('fImport').onchange=e=>{const fl=e.target.files[0];if(fl)importFile(fl);e.target.value=''};
function shrink(src,max,cb){const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.85))};im.src=src}

/* ================= BOTONES ================= */
document.getElementById('bPng').onclick=async()=>{
  if(!window.html2canvas){alert('Para exportar PNG se necesita conexión a internet (carga la librería html2canvas). Alternativa: Ctrl+P → Guardar como PDF.');return}
  const f=document.getElementById('flyer'), sc=document.getElementById('scaler'); const t=f.style.transform; f.style.transform='none'; sc.style.overflow='visible';
  try{ await document.fonts.ready; const c=await html2canvas(f,{scale:2,backgroundColor:null,useCORS:true});
    const a=document.createElement('a'); a.download='flash-informativo.png'; a.href=c.toDataURL('image/png'); a.click();
  } finally { f.style.transform=t; sc.style.overflow=''; }
};
document.getElementById('bHtml').onclick=()=>{
  const data=JSON.stringify(S,null,1).replace(/<\//g,'<\\/');
  const out=SRC.replace(/(<script type="application\/json" id="flyer-data">)[\s\S]*?(<\/script>)/,(m,a,b)=>a+data+b);
  const d=new Date(), tag=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const a=document.createElement('a');a.download='flash-informativo-'+tag+'.html';a.href=URL.createObjectURL(new Blob([out],{type:'text/html'}));a.click();
};
document.getElementById('bSave').onclick=()=>{const a=document.createElement('a');a.download='plantilla-flash.json';a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.click()};
document.getElementById('bLoad').onclick=()=>document.getElementById('fLoad').click();
document.getElementById('fLoad').onchange=e=>{const fl=e.target.files[0];if(!fl)return;fl.text().then(t=>{try{S=Object.assign(clone(DEFAULT),S,JSON.parse(t));buildForm();render();toast('✓ Plantilla cargada')}catch(err){alert('Archivo no válido')}});e.target.value=''};
document.getElementById('bReset').onclick=()=>{if(confirm('¿Volver a los datos guardados en este archivo? Se perderán los cambios no guardados.')){S=clone(DEFAULT);buildForm();render()}};

buildForm(); render();
document.fonts && document.fonts.ready.then(fit);
